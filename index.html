<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 500px;
            height: 700px;
            background: #1f2937;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .header {
            padding: 16px;
            background: #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            color: white;
        }

        #connectBtn {
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            background: #2563eb;
        }

        #connectBtn.connected {
            background: #dc2626;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px;
            border-radius: 12px;
            color: white;
            line-height: 1.4;
        }

        .user {
            align-self: flex-end;
            background: #2563eb;
        }

        .bot {
            align-self: flex-start;
            background: #374151;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 16px;
            background: #374151;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        #sendBtn {
            border: none;
            background: #10b981;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:disabled,
        input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

    </style>
</head>
<body>

<div class="chat-container">

    <div class="header">
        <h2>AI Agent</h2>
        <button id="connectBtn">
            Connect
        </button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
        <input
            id="messageInput"
            placeholder="Напиши повідомлення..."
            disabled
        >

        <button
            id="sendBtn"
            disabled
        >
            Send
        </button>
    </div>

</div>

<script>

    const API_URL =
        "https://ai-bot-v0-1.onrender.com/message";

    let connected = false;

    const connectBtn =
        document.getElementById("connectBtn");

    const messageInput =
        document.getElementById("messageInput");

    const sendBtn =
        document.getElementById("sendBtn");

    const messages =
        document.getElementById("messages");


    function updateConnectionUI() {

        if (connected) {

            connectBtn.textContent =
                "Disconnect";

            connectBtn.classList.add(
                "connected"
            );

            messageInput.disabled =
                false;

            sendBtn.disabled =
                false;

        } else {

            connectBtn.textContent =
                "Connect";

            connectBtn.classList.remove(
                "connected"
            );

            messageInput.disabled =
                true;

            sendBtn.disabled =
                true;
        }
    }


    connectBtn.onclick = () => {

        connected =
            !connected;

        updateConnectionUI();

        addMessage(
            "system",
            connected
                ? "Підключено до AI агента"
                : "З'єднання закрито"
        );
    };


    function addMessage(sender, text) {

        const div =
            document.createElement("div");

        div.classList.add(
            "message"
        );

        div.classList.add(
            sender === "user"
                ? "user"
                : "bot"
        );

        div.textContent =
            text;

        messages.appendChild(
            div
        );

        messages.scrollTop =
            messages.scrollHeight;
    }


    async function sendMessage() {

        if (!connected)
            return;

        const text =
            messageInput.value.trim();

        if (!text)
            return;

        addMessage(
            "user",
            text
        );

        messageInput.value = "";

        try {

            const response =
                await fetch(
                    API_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: text
                        })
                    }
                );

            const data =
                await response.json();

            addMessage(
                "bot",
                data.response
                    || data.message
                    || JSON.stringify(data)
            );

        } catch (error) {

            addMessage(
                "bot",
                "Помилка з'єднання"
            );
        }
    }


    sendBtn.onclick =
        sendMessage;


    messageInput.addEventListener(
        "keypress",
        e => {

            if (e.key === "Enter") {
                sendMessage();
            }
        }
    );


    updateConnectionUI();

</script>

</body>
</html>
